apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  namespace: ecommerce-infra
spec:
  serviceName: auth-db
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
      - name: mysql
        image: mysql:8
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-db-secret
              key: root-password
        - name: MYSQL_DATABASE
          value: usersdb
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: auth-db-secret
              key: user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-db-secret
              key: user-password
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/user-init.sql
          subPath: user-init.sql
      volumes:
      - name: init-script
        configMap:
          name: auth-db-init
          items:
          - key: user-init.sql
            path: user-init.sql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
