apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventory-db
  namespace: ecommerce-infra
spec:
  serviceName: inventory-db
  replicas: 1
  selector:
    matchLabels:
      app: inventory-db
  template:
    metadata:
      labels:
        app: inventory-db
    spec:
      containers:
      - name: mysql
        image: mysql:8
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: inventory-db-secret
              key: root-password
        - name: MYSQL_DATABASE
          value: inventorydb
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: inventory-db-secret
              key: user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: inventory-db-secret
              key: user-password
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/inventory-init.sql
          subPath: inventory-init.sql
      volumes:
      - name: init-script
        configMap:
          name: inventory-db-init
          items:
          - key: inventory-init.sql
            path: inventory-init.sql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
