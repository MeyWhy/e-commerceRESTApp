openapi: 3.0.3
info:
  title: E-Commerce REST API
  description: >
    Microservices-based e-commerce API: auth, orders, inventory, payments,
    shipping and notifications, fronted by an nginx API gateway.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: API gateway (local docker-compose)

tags:
  - name: Auth
  - name: Orders
  - name: Inventory
  - name: Payments
  - name: Shipping
  - name: Notifications

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Jane Doe" }
        username: { type: string, example: "janedoe" }
        email: { type: string, format: email, example: "jane@example.com" }
        address: { type: string, example: "123 Main St" }
        role: { type: string, enum: [customer, admin], example: customer }

    RegisterRequest:
      type: object
      required: [username, password, name, email, address]
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        password: { type: string, minLength: 8, format: password }
        name: { type: string }
        email: { type: string, format: email }
        address: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: JWT access token }
        user: { $ref: '#/components/schemas/User' }

    ValidationError:
      type: object
      properties:
        error: { type: string, example: "Validation failed" }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Error:
      type: object
      properties:
        error: { type: string }

    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        price: { type: number, format: float }

    Order:
      type: object
      properties:
        id: { type: integer }
        item: { type: string }
        quantity: { type: integer }
        user_id: { type: integer }
        status: { type: string, enum: [PENDING, PAID, SHIPPED, CANCELLED] }

    CreateOrderRequest:
      type: object
      required: [item, quantity, paymentMethod, userAdd]
      properties:
        item: { type: string, description: Product name }
        quantity: { type: integer, minimum: 1 }
        paymentMethod: { type: string, example: "card" }
        userAdd: { type: string, description: Shipping address }
        userId: { type: integer, description: Admin-only — place an order on behalf of another user }

    Payment:
      type: object
      properties:
        id: { type: integer }
        order_id: { type: integer }
        user_id: { type: integer }
        amount: { type: number, format: float }
        method: { type: string }
        status: { type: string, enum: [SUCCESS, FAILED] }

    CreatePaymentRequest:
      type: object
      required: [orderId, amount, method]
      properties:
        orderId: { type: integer }
        amount: { type: number, format: float }
        method: { type: string, example: "card" }

    Shipment:
      type: object
      properties:
        id: { type: integer }
        order_id: { type: integer }
        user_id: { type: integer }
        address: { type: string }
        status: { type: string, enum: [SHIPPED, IN_TRANSIT, DELIVERED] }
        tracking_id: { type: string }

    NotifyRequest:
      type: object
      required: [orderId, userId, message]
      properties:
        orderId: { type: integer }
        userId: { type: integer }
        message: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not allowed to access this resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: Validation failed or username already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/:
    get:
      tags: [Auth]
      summary: List all users (admin only)
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/{id}:
    get:
      tags: [Auth]
      summary: Get a user by id (self or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/auth/user/{id}:
    delete:
      tags: [Auth]
      summary: Delete a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: User deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orders/:
    get:
      tags: [Orders]
      summary: List all orders (admin only)
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Orders]
      summary: Create an order (validates user + inventory, publishes ORDER_CREATED event)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  orderId: { type: integer }
        '400': { description: Invalid user or product unavailable }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order (owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Orders]
      summary: Update an order (owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Order updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Orders]
      summary: Cancel an order (owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Order cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Orders]
      summary: Update order status (owner, admin, or an internal service call)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Status updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/orders/total/quantity:
    get:
      tags: [Orders]
      summary: Total quantity ordered across all orders
      security: []
      responses:
        '200':
          description: Aggregate quantity
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalQuantity: { type: integer }

  /api/products/:
    get:
      tags: [Inventory]
      summary: List all products
      security: []
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Inventory]
      summary: Create a product (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                quantity: { type: integer }
                price: { type: number, format: float }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/products/{id}:
    get:
      tags: [Inventory]
      summary: Get a product by id
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Inventory]
      summary: Update product quantity or price (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Product updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Inventory]
      summary: Delete a product (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Product deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/products/validate/{item}:
    get:
      tags: [Inventory]
      summary: Internal — validate a product exists and has stock (used by order-service)
      security: []
      parameters:
        - name: item
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  product: { $ref: '#/components/schemas/Product' }

  /api/products/available/stock:
    get:
      tags: [Inventory]
      summary: List products currently in stock
      security: []
      responses:
        '200':
          description: In-stock products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }

  /api/payments/:
    get:
      tags: [Payments]
      summary: List all payments (admin only)
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Payments]
      summary: Pay for an order (owner of the order, or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { description: Order has no associated user }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/payments/{id}:
    get:
      tags: [Payments]
      summary: Get a payment by id (owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/payments/order/{id}:
    get:
      tags: [Payments]
      summary: Get payment(s) for an order (owner, admin, or internal service)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Payment(s) found
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/shipping/:
    get:
      tags: [Shipping]
      summary: List all shipments (admin only)
      responses:
        '200':
          description: List of shipments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Shipment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Shipping]
      summary: Internal — create a shipment (called by order-worker, requires internal service key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, userId, address]
              properties:
                orderId: { type: integer }
                userId: { type: integer }
                address: { type: string }
      responses:
        '201':
          description: Shipment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '400': { description: Missing userId }
        '401': { description: Missing or invalid internal service key }

  /api/shipping/{id}:
    get:
      tags: [Shipping]
      summary: Get a shipment (owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Shipment found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Shipping]
      summary: Update shipment status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Shipment updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/notifications/notify:
    post:
      tags: [Notifications]
      summary: Send a notification (called internally when order/payment/shipping events occur)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotifyRequest' }
      responses:
        '200': { description: Notification sent }
        '400': { description: Missing required fields }
