limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
server {
    listen 8080;

    # Health check
    location /api/health {
        return 200 'API Gateway is running\n';
    }

    # CORS
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Allow-Credentials "false" always;

    # Handle OPTIONS preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # AUTH
    location ^~ /api/auth/ {
        proxy_pass http://auth-service:3007/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/auth {
        return 301 /api/auth/;
    }
 

    # ORDER
    location /api/orders/ {
        proxy_pass http://order-service:3001/api/orders/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/orders {
        proxy_pass http://order-service:3001/api/orders/;
    }

    # INVENTORY
    location /api/products/ {
        proxy_pass http://inventory-service:3002/api/products/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/products {
        proxy_pass http://inventory-service:3002/api/products/;
    }

    # PAYMENT
    location /api/payments/ {
        proxy_pass http://payment-service:3004/api/payments/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/payments {
        proxy_pass http://payment-service:3004/api/payments/;
    }

    # SHIPPING
    location /api/shipping/ {
        proxy_pass http://shipping-service:3005/api/shipping/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/shipping {
        proxy_pass http://shipping-service:3005/api/shipping/;
    }

    # NOTIFICATION
    location /api/notifications/ {
        proxy_pass http://notification-service:3006/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/notifications {
        proxy_pass http://notification-service:3006/api/;
    }
}
